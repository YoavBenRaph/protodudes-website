{% extends "admin/base_admin.html" %}
{% block title %}Change Password — PROTODUDES Admin{% endblock %}

{% block content %}
<a href="{{ url_for('admin_dashboard') }}" class="back-link">← Back</a>
<h1 class="page-title">Change Password</h1>
<div class="detail-card" style="max-width:480px">
  <form method="POST" class="contact-form" autocomplete="off">
    <div class="form-group full-width">
      <label>Current Password</label>
      <input type="password" name="current_password" required autocomplete="current-password" />
    </div>
    <div class="form-group full-width">
      <label>New Password (min 8 characters)</label>
      <input type="password" name="new_password" required minlength="8" autocomplete="new-password" />
    </div>
    <div class="form-group full-width">
      <label>Confirm New Password</label>
      <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password" />
    </div>
    <button type="submit" class="btn btn-primary">Update Password</button>
  </form>
</div>
{% endblock %}
